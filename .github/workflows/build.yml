name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Public CI: no repository secrets are used. The APK is built without a Gemini key
# (the app installs but shows "API key नहीं मिली") and is signed only with the runner's
# throwaway auto-generated debug key. Build locally with your own key to use the app.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Default packages list includes the legacy 'tools' package, which Google has
          # removed from the SDK repository (sdkmanager now fails with "Failed to find
          # package 'tools'"). Gradle resolves its own build-tools/platform via the
          # Gradle plugin; only platform-tools (adb etc.) is actually needed here.
          packages: "platform-tools"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mother-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
